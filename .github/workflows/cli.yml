name: CLI and service checks
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"
permissions:
  contents: read
jobs:
  lean-audit-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.changes.outputs.required }}
      reason: ${{ steps.changes.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        run: python3 scripts/lean-audit-changes.py
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: 1.91.1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: ${{ matrix.rust }}
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Install server contract dependencies
        run: npm ci --prefix ..
      - name: Check crates.io package
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: |
          cargo publish --dry-run --locked --registry crates-io
          cargo package --locked
          cargo build --manifest-path target/package/cargo-proofs-*/Cargo.toml --target-dir target/package-check --locked
          python3 target/package/cargo-proofs-*/tests/preview.py target/package-check/debug/cargo-proofs
          PROOFS_CONTRACT_OUTPUT="$RUNNER_TEMP/proofs-package-contract" PROOFS_TEST_CLI="$PWD/target/package-check/debug/cargo-proofs" npm --prefix .. run test:cli-contract
          python3 -c 'from pathlib import Path; assert any(p.stat().st_size for p in Path("target/package").glob("*.crate")), "Missing release archive"'
      - name: CLI export to server ingestion contract
        env:
          PROOFS_CONTRACT_OUTPUT: ${{ runner.temp }}/proofs-recording-contract
        run: |
          npm --prefix .. run test:cli-contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recording-contract-${{ matrix.os }}-${{ matrix.rust }}
          path: |
            ${{ runner.temp }}/proofs-recording-contract
            ${{ runner.temp }}/proofs-package-contract
          if-no-files-found: ignore
      - run: python3 tests/preview.py target/debug/cargo-proofs
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo run -- proofs --help
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.45"
      - run: npm ci
      - run: npm run check:recording-schema
      - run: npm run check:preview
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  lean-audit:
    needs: lean-audit-changes
    if: needs.lean-audit-changes.outputs.required == 'true'
    env:
      LEAN_TOOLCHAIN: leanprover/lean4:v4.35.0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set shared Aeneas cache path
        run: echo "PROOFS_TEST_AENEAS_CACHE=$RUNNER_TEMP/proofs-aeneas-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        id: cargo-cache
        with:
          workspaces: cli
          shared-key: lean-audit
      - uses: actions/cache/restore@v4
        id: lean-cache
        with:
          path: ~/.elan
          key: lean-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LEAN_TOOLCHAIN }}
      - name: Install pinned Lean
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain "$LEAN_TOOLCHAIN"
      - name: Activate pinned Lean
        run: |
          "$HOME/.elan/bin/lean" +"$LEAN_TOOLCHAIN" --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/save@v4
        if: steps.lean-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.elan
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        id: aeneas-cache
        with:
          path: |
            ${{ env.PROOFS_TEST_AENEAS_CACHE }}/.lake/packages
            ${{ env.PROOFS_TEST_AENEAS_CACHE }}/lake-manifest.json
          key: aeneas-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LEAN_TOOLCHAIN }}-${{ hashFiles('cli/tests/fixtures/aeneas-formal/**', 'scripts/prepare-lean-audit.py') }}
      - name: Prepare shared pinned Aeneas dependencies
        id: prepare
        env:
          CACHE_HIT: ${{ steps.aeneas-cache.outputs.cache-hit }}
        run: |
          started=$SECONDS
          if [ "$CACHE_HIT" != true ]; then
            python3 scripts/prepare-lean-audit.py "$PROOFS_TEST_AENEAS_CACHE"
          fi
          echo "seconds=$((SECONDS - started))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: steps.aeneas-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ env.PROOFS_TEST_AENEAS_CACHE }}/.lake/packages
            ${{ env.PROOFS_TEST_AENEAS_CACHE }}/lake-manifest.json
          key: ${{ steps.aeneas-cache.outputs.cache-primary-key }}
      - name: Check generated audit with real Lean and Aeneas
        working-directory: cli
        run: cargo test --locked aeneas::tests::real_ -- --ignored --test-threads=1
      - name: Build CLI for real evidence recording
        working-directory: cli
        run: cargo build --locked
      - name: Record, publish locally, and render real formal evidence
        run: |
          python3 cli/tests/aeneas_e2e.py cli/target/debug/cargo-proofs /tmp/aeneas-record
          PROOFS_REAL_AENEAS_RECORD=/tmp/aeneas-record/record.json node --import tsx --test --test-name-pattern='real Aeneas run' tests/app.test.ts
      - name: Summarize Lean audit preparation
        if: always()
        env:
          AUDIT_REASON: ${{ needs.lean-audit-changes.outputs.reason }}
          LEAN_HIT: ${{ steps.lean-cache.outputs.cache-hit }}
          AENEAS_HIT: ${{ steps.aeneas-cache.outputs.cache-hit }}
          CARGO_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          PREPARE_SECONDS: ${{ steps.prepare.outputs.seconds }}
        run: |
          {
            echo '### Lean audit preparation'
            echo "Reason: $AUDIT_REASON"
            echo "Lean cache hit: ${LEAN_HIT:-false}"
            echo "Aeneas cache hit: ${AENEAS_HIT:-false}"
            echo "Cargo cache hit: ${CARGO_HIT:-false}"
            echo "Dependency preparation seconds: ${PREPARE_SECONDS:-unavailable}"
          } >> "$GITHUB_STEP_SUMMARY"
