name: Staging
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: proofs-rs-staging
  cancel-in-progress: false
jobs:
  deploy:
    # Only trusted staging/* PR branches may deploy using staging credentials.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'staging/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
      url: ${{ steps.resources.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.45"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Provision isolated staging resources
        id: resources
        run: node scripts/provision.mjs
        env:
          GITHUB_CLIENT_ID: ${{ vars.STAGING_GITHUB_CLIENT_ID }}
          ADMIN_GITHUB_IDS: ${{ vars.ADMIN_GITHUB_IDS }}
          EMAIL_FROM: ${{ vars.STAGING_EMAIL_FROM }}
          EMAIL_ALLOWLIST: ${{ vars.STAGING_EMAIL_ALLOWLIST }}
          EMAIL_DOMAIN: ${{ vars.STAGING_EMAIL_DOMAIN }}
          EMAIL_EVENT_SUBSCRIPTION: ${{ vars.STAGING_EMAIL_EVENT_SUBSCRIPTION }}
      - name: Preserve existing runs with the one-time staging migration
        run: node --import tsx scripts/dependency-rollout.mjs staging wrangler.staging.json '${{ steps.resources.outputs.url }}'
      - name: Require completed dependency migration
        run: node scripts/dependency-rollout-gate.mjs wrangler.staging.json
      - run: npx wrangler d1 migrations apply DB --remote --config wrangler.staging.json
      - run: npx wrangler deploy --config wrangler.staging.json
      - name: Configure secrets without logging values
        run: node scripts/secrets.mjs
        env:
          GITHUB_CLIENT_SECRET: ${{ secrets.STAGING_GITHUB_CLIENT_SECRET }}
          TOKEN_SECRET: ${{ secrets.STAGING_TOKEN_SECRET }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_TOKEN }}
      - name: Refresh imported API catalogues
        run: node --import tsx scripts/refresh-catalogs.mjs wrangler.staging.json
      - name: Public read-only smoke check
        run: node scripts/smoke.mjs '${{ steps.resources.outputs.url }}'
      - name: Seed staging examples
        run: node scripts/seed-staging.mjs
      - name: Deployment summary
        run: |
          echo 'Staging deployed to ${{ steps.resources.outputs.url }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Commit: `${{ github.event.pull_request.head.sha || github.sha }}`' >> "$GITHUB_STEP_SUMMARY"
