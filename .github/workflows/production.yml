name: Production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proofs-rs-production
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/cli.yml
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.resources.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      PRODUCTION_CUSTOM_DOMAIN: ${{ vars.PRODUCTION_CUSTOM_DOMAIN }}
      PRODUCTION_EMAIL_ENABLED: ${{ vars.PRODUCTION_EMAIL_ENABLED }}
      EMAIL_EVENT_SUBSCRIPTION: ${{ vars.PRODUCTION_EMAIL_EVENT_SUBSCRIPTION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.45"
      - run: npm ci
      - run: npm run build
      - name: Reject outdated main runs
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              ...context.repo, ref: 'heads/main',
            });
            if (data.object.sha !== context.sha) {
              core.setFailed('main has advanced; let the newer Production run deploy.');
            }
      - name: Provision isolated production resources
        id: resources
        run: node scripts/provision.mjs production
        env:
          GITHUB_CLIENT_ID: ${{ vars.PRODUCTION_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.PRODUCTION_GITHUB_CLIENT_SECRET }}
          ADMIN_GITHUB_IDS: ${{ vars.ADMIN_GITHUB_IDS }}
      - name: Require completed dependency snapshot rollout
        run: node scripts/dependency-rollout-gate.mjs wrangler.production.json
      - run: npx wrangler d1 migrations apply DB --remote --config wrangler.production.json
      - run: npx wrangler deploy --config wrangler.production.json
      - name: Refresh imported API catalogues
        run: node --import tsx scripts/refresh-catalogs.mjs wrangler.production.json
      - name: Configure production secrets
        run: node scripts/secrets.mjs production
        env:
          GITHUB_CLIENT_SECRET: ${{ secrets.PRODUCTION_GITHUB_CLIENT_SECRET }}
          TOKEN_SECRET: ${{ secrets.PRODUCTION_TOKEN_SECRET }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_TOKEN }}
      - name: Production read-only smoke check
        run: node scripts/smoke.mjs '${{ steps.resources.outputs.url }}' production
      - name: Inspect domain onboarding status
        run: node scripts/domain-status.mjs
      - name: Deployment summary
        run: echo 'Production Worker deployed to ${{ steps.resources.outputs.url }}. Check the domain/OAuth readiness summary before announcing launch.' >> "$GITHUB_STEP_SUMMARY"
