name: Read-only deployment security verification
on:
  workflow_dispatch:
  push:
    branches: [ops/security-postdeploy]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'proofs-rs/proofs-rs' && (github.ref == 'refs/heads/ops/security-postdeploy' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify live URL settings and inspect token metadata
        run: node scripts/security-postdeploy.mjs '${{ matrix.environment }}'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
