[package]
name = "cargo-proofs"
version = "0.4.1"
edition = "2021"
rust-version = "1.91"
description = "Publish Rust verification reports to proofs.rs"
repository = "https://github.com/proofs-rs/proofs-rs"
homepage = "https://proofs.rs"
readme = "README.md"
keywords = ["verification", "kani", "creusot", "aeneas", "proofs"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT OR Apache-2.0"
publish = ["crates-io"]
include = ["src/**", "preview/**", "protocol/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE*"]

[dependencies]
jsonschema = { version = "=0.33.0", default-features = false }
anyhow = "1"
ctrlc = { version = "3.5", features = ["termination"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ignore = "0.4"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit", "visit-mut", "extra-traits"] }
tempfile = "3"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tiny_http = "0.12"
